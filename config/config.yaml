# Configuración base rápida 
# Es la configuración default usada por training_pipeline.py.

proyecto:
  nombre: "Parcial MLOps - Propensión de venta bancaria"
  autor: "Gariazzo Anarcaya, Uzziell Neyrho"
  random_state: 42

experimento:
  nombre: "experimento_base_rapido"
  descripcion: "Corrida liviana para validar el flujo completo en pocos minutos. Usa data real desde Git si no existe localmente."

data:
  url_base: "https://media.githubusercontent.com/media/Uz-iel/Examen-parcial/main/data"
  archivo_periodo: "p{period}_extrac.csv"
  raw_training_dir: "data/raw/training"
  raw_inference_dir: "data/raw/inference"
  processed_training_dir: "data/processed/training"
  processed_inference_dir: "data/processed/inference"
  auto_download: true
  limite_filas_por_periodo: 30000
  limite_filas_inferencia: 30000

periodos:
  entrenamiento: [1, 2]
  validacion: [3]
  oot: [4]
  inferencia_demo: 5

training:
  modelos: ["LogisticRegression", "RandomForest", "ExtraTrees", "GradientBoosting"]
  umbral_clasificacion: 0.50
  stability_threshold: 0.03
  cv_folds: 2
  bayesian_n_iter: 2
  hpo_sample_size: 30000
  max_workers: 4

postprocessing:
  n_grupos_ejecucion: 10
  frescura_default: 0.004
  frescura_map:
    G1: 0.066
    G2: 0.028
    G3: 0.022
    G4: 0.008
    G5: 0.004
    OTRO: 0.004

paths:
  logs_dir: "logs"
  output_dir: "output"
  best_model_dir: "best_model"

mlflow:
  tracking_uri: "sqlite:///mlflow_store/mlflow.db"
  experiment_name: "parcial_mlops_propension"
